
name: CI/CD Simple Web Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Build Website
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Test Website
        run: |
          test -s dist/index.html
          grep -qi "<html" dist/index.html
          grep -qi "</html>" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
